name: SQL Autograding

on:
  push:
    branches: [main]
  pull_request:

jobs:
  autograde:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

    - uses: actions/checkout@v4

    - name: Install MySQL Client
      run: |
        sudo apt update
        sudo apt install mysql-client -y

    - name: Wait for MySQL
      run: |
        until mysqladmin ping -h127.0.0.1 -uroot -proot --silent
        do
          sleep 2
        done

    - name: Make Script Executable
      run: chmod +x test.sh

    - name: Run Autograder
      run: ./test.sh
